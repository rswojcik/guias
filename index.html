<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lista de Guias</title>
</head>
<body>
  <h1>Guias e Tutoriais</h1>
  <ul id="lista"></ul>

  <script>
    const repoOwner = "rswojcik";
    const repoName = "guias";

    fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents`)
      .then(res => res.json())
      .then(files => {
        const lista = document.getElementById("lista");
        files.forEach(file => {
          if (file.name.endsWith(".html") && file.name !== "index.html") {
            const li = document.createElement("li");
            li.innerHTML = `<a href="${file.name}">${file.name.replace(".html", "")}</a>`;
            lista.appendChild(li);
          }
        });
      });
  </script>
</body>
</html>
